<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#08090a">
<meta name="robots" content="noindex">
<title>Avron</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
</head>
<body>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<template id="tpl-login">
  <div class="login-screen">
    <form class="login-card" id="login-form">
      <div class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" width="40" height="40">
          <path d="M16 3.2 4.6 26.4h5.1l2.2-4.7h8.2l2.2 4.7h5.1L16 3.2Z" fill="url(#lg)"/>
          <path d="M13.5 17.6h5l-2.5-5.4-2.5 5.4Z" fill="var(--bg)"/>
          <defs><linearGradient id="lg" x1="4.6" y1="3.2" x2="27.4" y2="26.4" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8FA0FF"/><stop offset="1" stop-color="#4FC3F7"/></linearGradient></defs>
        </svg>
      </div>
      <h1>Avron</h1>
      <p>PII detection and masking for LLM traffic.</p>
      <div id="login-error"></div>
      <label class="field">
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" autofocus required>
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn" type="submit" style="width:100%">Sign in</button>
      <p class="field-note" style="margin-top:18px">
        First run? The password was printed once to the container log:
        <code>docker logs avron 2&gt;&amp;1 | grep -A6 credentials</code>
      </p>
    </form>
  </div>
</template>

<template id="tpl-shell">
  <div class="shell">
    <div class="topbar">
      <button class="btn ghost small" id="menu-btn" aria-label="Menu">☰</button>
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 3.2 4.6 26.4h5.1l2.2-4.7h8.2l2.2 4.7h5.1L16 3.2Z" fill="url(#tg)"/>
          <path d="M13.5 17.6h5l-2.5-5.4-2.5 5.4Z" fill="var(--surface)"/>
          <defs><linearGradient id="tg" x1="4.6" y1="3.2" x2="27.4" y2="26.4" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8FA0FF"/><stop offset="1" stop-color="#4FC3F7"/></linearGradient></defs>
        </svg>Avron</div>
      <div class="spacer"></div>
      <span id="who-mobile" class="field-note" style="margin:0"></span>
    </div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M16 3.2 4.6 26.4h5.1l2.2-4.7h8.2l2.2 4.7h5.1L16 3.2Z" fill="url(#sg)"/>
          <path d="M13.5 17.6h5l-2.5-5.4-2.5 5.4Z" fill="var(--surface)"/>
          <defs><linearGradient id="sg" x1="4.6" y1="3.2" x2="27.4" y2="26.4" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8FA0FF"/><stop offset="1" stop-color="#4FC3F7"/></linearGradient></defs>
        </svg>
        <div>Avron<span>PII gateway</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div id="who"></div>
        <button class="btn ghost small" id="signout" style="margin-top:9px;width:100%">Sign out</button>
      </div>
    </aside>
    <main class="main" id="view"></main>
  </div>
</template>

<script src="/static/app.js"></script>
</body>
</html>
